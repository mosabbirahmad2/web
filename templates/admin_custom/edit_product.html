{% extends 'admin_custom/base.html' %}
{% block content %}
<div class="p-8 max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-2xl font-bold text-slate-800 serif">{{ page_title }}</h1>
            <p class="text-sm text-slate-500">Update your product details and inventory</p>
        </div>
        <a href="/admin-products/" class="text-slate-500 hover:text-slate-800 transition text-sm font-medium">
            <i class="fa-solid fa-arrow-left mr-2"></i> Back to Inventory
        </a>
    </div>

    <div class="bg-white rounded-3xl shadow-sm border zatiq-border overflow-hidden">
        <form method="POST" enctype="multipart/form-data" class="p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
            {% csrf_token %}

            <!-- Product Image -->
            <div class="md:col-span-1">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Product Image</label>
                <div class="relative border-2 border-dashed border-slate-200 rounded-2xl p-4 text-center hover:border-indigo-400 transition cursor-pointer bg-slate-50 h-64 flex flex-col items-center justify-center overflow-hidden" onclick="document.getElementById('imageInput').click()">
                    <input type="file" id="imageInput" name="image" class="hidden" accept="image/*" onchange="previewImage(this)">
                    <div id="imagePreview" class="flex flex-col items-center justify-center w-full h-full">
                        {% if product.image %}
                            <img src="{{ product.image.url }}" class="w-full h-full object-cover rounded-xl" alt="Current Image">
                        {% else %}
                            <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-300 mb-2"></i>
                            <p class="text-xs text-slate-400">Click to upload image</p>
                        {% endif %}
                    </div>
                </div>
            </div>

            <div class="md:col-span-1 space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Category</label>
                    <select name="category" required class="w-full px-4 py-2 bg-slate-50 border zatiq-border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 transition">
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if cat.id == product.category.id %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Product Name</label>
                    <input type="text" name="name" required value="{{ product.name }}" class="w-full px-4 py-2 bg-slate-50 border zatiq-border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 transition">
                </div>
            </div>

            <div class="md:col-span-2">
                <label class="block text-sm font-semibold text-slate-700 mb-1">Description (Optional)</label>
                <textarea name="description" rows="4" class="w-full px-4 py-2 bg-slate-50 border zatiq-border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 transition">{{ product.description }}</textarea>
            </div>

            <div class="grid grid-cols-2 gap-6 md:col-span-2">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Price ($)</label>
                    <input type="number" step="0.01" name="price" required value="{{ product.price }}" class="w-full px-4 py-2 bg-slate-50 border zatiq-border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Stock Quantity</label>
                    <input type="number" name="stock" required value="{{ product.stock }}" class="w-full px-4 py-2 bg-slate-50 border zatiq-border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 transition">
                </div>
            </div>

            <div class="md:col-span-2 flex justify-end space-x-3 pt-6 border-t zatiq-border">
                <a href="/admin-products/" class="px-6 py-2 text-sm font-bold text-slate-500 hover:text-slate-800 transition">Cancel</a>
                <button type="submit" class="zatiq-purple text-white px-8 py-2 rounded-xl font-bold text-sm hover:bg-indigo-700 transition shadow-lg shadow-indigo-200">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<script>
    function previewImage(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imagePreview').innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover rounded-xl">`;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
{% endblock %}
