{% extends 'admin_custom/base.html' %}
{% block content %}
<div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
    <div class="p-6 border-b">
        <h3 class="text-lg font-bold text-slate-800">Customer Directory</h3>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full text-left">
            <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-widest">
                <tr>
                    <th class="px-6 py-4 font-semibold">Customer</th>
                    <th class="px-6 py-4 font-semibold">Email</th>
                    <th class="px-6 py-4 font-semibold">Orders</th>
                    <th class="px-6 py-4 font-semibold">Total Spend</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                {% for customer in customers %}
                <tr class="hover:bg-slate-50 transition">
                    <td class="px-6 py-4 font-medium text-slate-800">{{ customer.name }}</td>
                    <td class="px-6 py-4 text-sm text-slate-500">{{ customer.email }}</td>
                    <td class="px-6 py-4 text-sm text-slate-500">{{ customer.orders }}</td>
                    <td class="px-6 py-4 text-sm font-bold">${{ customer.spend }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
