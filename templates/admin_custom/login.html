<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zatiq Admin | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-[#0f172a] flex items-center justify-center min-h-screen p-6 overflow-hidden">

    <!-- Advanced Animated Background -->
    <div class="absolute inset-0 -z-10">
        <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-indigo-500/20 rounded-full blur-[120px] animate-pulse"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-purple-500/20 rounded-full blur-[120px] animate-pulse" style="animation-delay: 2s"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full opacity-20"
             style="background-image: radial-gradient(#4f46e5 1px, transparent 1px); background-size: 30px 30px;"></div>
    </div>

    <div class="w-full max-w-md">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 text-white rounded-2xl shadow-2xl shadow-indigo-500/50 mb-4">
                <i class="fa-solid fa-bolt text-3xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Zatiq <span class="text-indigo-400">Admin</span></h1>
            <p class="text-slate-400 mt-2">Welcome back. Please enter your details.</p>
        </div>

        <div class="bg-white/10 backdrop-blur-xl p-8 rounded-[2.5rem] shadow-2xl border border-white/10">
            <form method="POST" action="/django-admin/login/" class="space-y-6">
                {% csrf_token %}
                <div class="group">
                    <label class="block text-sm font-medium text-slate-300 mb-2 ml-1 transition-colors group-focus-within:text-indigo-400">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500 group-focus-within:text-indigo-400 transition-colors">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" name="username" required
                               class="w-full pl-11 pr-4 py-3.5 bg-slate-900/50 border border-slate-700 text-white rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all placeholder:text-slate-600"
                               placeholder="Enter your username">
                    </div>
                </div>
                <div class="group">
                    <label class="block text-sm font-medium text-slate-300 mb-2 ml-1 transition-colors group-focus-within:text-indigo-400">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500 group-focus-within:text-indigo-400 transition-colors">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" name="password" required
                               class="w-full pl-11 pr-4 py-3.5 bg-slate-900/50 border border-slate-700 text-white rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all placeholder:text-slate-600"
                               placeholder="••••••••">
                    </div>
                </div>
                <div class="flex items-center justify-between text-sm px-1">
                    <label class="flex items-center text-slate-400 cursor-pointer hover:text-slate-200 transition-colors">
                        <input type="checkbox" class="w-4 h-4 rounded border-slate-700 bg-slate-900 text-indigo-600 focus:ring-indigo-500 mr-2">
                        Remember me
                    </label>
                    <a href="#" class="text-indigo-400 font-medium hover:text-indigo-300 transition-colors">Forgot Password?</a>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-4 rounded-2xl font-bold text-lg hover:from-indigo-500 hover:to-purple-500 transition-all transform active:scale-[0.98] shadow-xl shadow-indigo-500/20">
                    Sign In to Dashboard
                </button>
            </form>
        </div>

        <p class="text-center text-slate-500 text-sm mt-8 font-light tracking-wide">
            &copy; 2026 <span class="text-slate-400 font-medium">Elite Accessories</span> Admin Portal.
        </p>
    </div>

</body>
</html>
