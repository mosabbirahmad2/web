{% extends 'admin_custom/base.html' %}
{% block content %}
<div class="p-8 max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-2xl font-bold text-slate-800 serif">{{ page_title }}</h1>
            <p class="text-sm text-slate-500">Manage category hierarchy and naming</p>
        </div>
        <a href="/admin-categories/" class="text-slate-500 hover:text-slate-800 transition text-sm font-medium">
            <i class="fa-solid fa-arrow-left mr-2"></i> Back to Categories
        </a>
    </div>

    <div class="bg-white rounded-3xl shadow-sm border zatiq-border overflow-hidden">
        <form method="POST" class="p-8 space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Category Name *</label>
                <input type="text" name="name" required value="{{ category.name }}" class="w-full px-4 py-3 bg-slate-50 border zatiq-border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 transition">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Parent Category (Optional)</label>
                <select name="parent" class="w-full px-4 py-3 bg-slate-50 border zatiq-border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 transition">
                    <option value="">None (Root Category)</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if cat.id == category.parent.id %}selected{% endif %}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="flex justify-end space-x-3 pt-6 border-t zatiq-border">
                <a href="/admin-categories/" class="px-6 py-2 text-sm font-bold text-slate-500 hover:text-slate-800 transition">Cancel</a>
                <button type="submit" class="zatiq-purple text-white px-8 py-2 rounded-xl font-bold text-sm hover:bg-indigo-700 transition shadow-lg shadow-indigo-200">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
